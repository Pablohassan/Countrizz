name: deploy
# Contrôle statique du déploiement (sans cluster ni image) : vérification des patchs image.
# L'image se construit sur le Mac (deploy/scripts/build-image.sh) ; le manifeste s'applique depuis rpi1.
on:
  push:
    paths: ['deploy/**', '.github/workflows/deploy-ci.yml']
  pull_request:
    paths: ['deploy/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'deploy/scripts/patchs.test.mjs'
