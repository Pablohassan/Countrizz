# =============================================================================
# countrizz.fr - Countrizz (jeu de geographie, globe 3D WebGPU, PWA)
# Frontend : 192.168.1.101:80 (MetalLB, countrizz/web)    - IP reservee, pas encore deploye
# API scores : 192.168.1.102:80 (MetalLB, countrizz/scores) - IP reservee, pas encore deploye
# Certificat : countrizz.fr + www.countrizz.fr (webroot, ecdsa), etendu a www le 02/10/2026.
# =============================================================================

# HTTP -> HTTPS
server {
    listen 80;
    server_name countrizz.fr www.countrizz.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name countrizz.fr www.countrizz.fr;

    ssl_certificate /etc/letsencrypt/live/countrizz.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/countrizz.fr/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;
    include snippets/block-malicious.conf;

    client_max_body_size 10M;

    # API scores -> service countrizz/scores (same-origin, pas de CORS)
    location /api/ {
        proxy_pass http://192.168.1.102/api/;
        include snippets/proxy-params.conf;
    }

    # PWA : service worker et manifest jamais mis en cache (mises a jour de l app).
    # expires -1 (et non add_header) pour conserver les en-tetes de securite du serveur.
    location = /sw.js {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
        expires -1;
    }

    location = /registerSW.js {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
        expires -1;
    }

    location = /manifest.webmanifest {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
        expires -1;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://192.168.1.101;
        include snippets/proxy-params.conf;
    }
}
