# Site statique Countrizz (image nginxinc/nginx-unprivileged : utilisateur 101, port 8080).
# Le proxy .60 termine TLS et relaie vers le Service (port 80 → 8080) ; les en-têtes de sécurité sont posés par .60.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # ktx2 manque dans /etc/nginx/mime.types (wasm y est) : on l'ajoute sans remplacer la table héritée.
    include /etc/nginx/mime.types;
    types { image/ktx2 ktx2; application/manifest+json webmanifest; }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Rapports de l'encart `?mesure` (fenêtres d'images d'un téléphone, MeasureOverlay.tsx) : la requête elle-même, avec ses
    # paramètres, est la donnée ; elle se lit dans le journal du pod.
    location = /__mesure { default_type text/plain; return 204; }

    # Sonde de vie (kubelet), sans journal.
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Fichiers hachés par Vite : cache immuable.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Index de données (countries.json, imagery.json…) : revalidés à chaque visite — un ancien index en cache avec un
    # nouveau code bloquerait le jeu. AVANT la règle suivante : nginx retient la première location regex qui correspond.
    location ~ ^/data/[a-z]+\.json$ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Noms fixes (patchs, textures, drapeaux, données, transcodeur, affiches et ancres de l'intro, vidéos de l'intro, police,
    # icônes) : cache court, revalidé par ETag. Sur l'appareil, le service worker les garde (caches nommés par l'empreinte de
    # leur contenu) — sauf les vidéos (/video/), lues en flux par plages d'octets (206), que nginx sert telles quelles.
    location ~ ^/(data|textures|basis|intro|video|fonts|icons)/ { add_header Cache-Control "public, max-age=3600, must-revalidate"; try_files $uri =404; }

    # Pages, service worker, manifeste et index de données : toujours revalidés (une nouvelle version doit être vue tout de
    # suite ; un ancien countries.json en cache avec un nouveau code bloquerait le jeu). probe.html et calibrate.html :
    # pages de test publiées pour les e2e sur le site déployé (09/10/2026).
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location ~ ^/(index\.html|demo\.html|probe\.html|calibrate\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Le reste n'existe pas : un patch absent doit rendre 404 (le jeu passe alors à la texture globale).
    location / { try_files $uri =404; }
}
