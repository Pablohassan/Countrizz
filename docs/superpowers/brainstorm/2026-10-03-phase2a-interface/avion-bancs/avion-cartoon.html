<style>
.d5.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;font-family:'Chango',system-ui;background:#000;box-shadow:0 0 0 10px #0b0b10,0 12px 36px rgba(0,0,0,.45)}
.d5 .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 30px 60px,#fff,transparent),radial-gradient(1px 1px at 120px 140px,#ddd,transparent),radial-gradient(1.5px 1.5px at 300px 90px,#fff,transparent),radial-gradient(1px 1px at 250px 220px,#ccc,transparent),radial-gradient(1px 1px at 60px 300px,#fff,transparent),radial-gradient(1px 1px at 350px 330px,#bbb,transparent),radial-gradient(1.5px 1.5px at 180px 380px,#fff,transparent),radial-gradient(1px 1px at 20px 400px,#ccc,transparent),radial-gradient(1px 1px at 330px 20px,#fff,transparent)}
.d5 .globe{position:absolute;inset:0;background:url('/files/acc-16.png') center 400px/390px 844px no-repeat}
.d5 .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:18px;background:#000;z-index:9}
.d5 .lang{position:absolute;top:56px;right:18px;z-index:6;display:flex;border:2px solid #000;box-shadow:3px 3px 0 #000;border-radius:10px;overflow:hidden;font-size:14px}
.d5 .lang span{padding:5px 10px;background:#16173a;color:#f7dc6f}
.d5 .lang span.on{background:#f7dc6f;color:#16173a}
.d5 .title{position:absolute;top:110px;left:0;right:0;text-align:center;z-index:5;color:#f7dc6f;font-size:54px;text-shadow:-6px 4px 2px rgb(11,13,15);letter-spacing:1px}
.d5 .controls{position:absolute;top:215px;left:28px;right:28px;z-index:5;display:flex;flex-direction:column;align-items:stretch;gap:18px}
.d5 .name{background:#16173a;border:3px solid #f7dc6f;box-shadow:4px 4px 0 #000;color:rgba(247,220,111,.55);padding:12px 14px;font-size:16px;border-radius:4px}
.d5 .name b{color:#f7dc6f;font-weight:normal}
.d5 .play{align-self:center;display:flex;align-items:center;gap:18px;background:#6225e6;color:#fff;border:2px solid #000;box-shadow:6px 6px 0 #000;transform:skewX(-15deg);padding:12px 30px;font-size:30px}
.d5 .play>span{transform:skewX(15deg);display:inline-block}
.d5 .play svg{width:40px;height:26px;transform:skewX(15deg)}
.d5 .row2{display:flex;justify-content:center;gap:18px}
.d5 .sec{background:#16173a;color:#f7dc6f;border:2px solid #000;box-shadow:4px 4px 0 #000;transform:skewX(-15deg);padding:9px 18px;font-size:15px}
.d5 .sec>span{transform:skewX(15deg);display:inline-block}
.d5 .credit{position:absolute;left:12px;right:10px;bottom:38px;z-index:6;font:10px/1.3 system-ui,sans-serif;color:rgba(255,255,255,.7);text-shadow:0 0 2px #000;text-align:right}
.d5 .credit u{text-decoration:underline}

/* ===== repères : épingles plantées dans le globe ===== */
.d5 .mk{position:absolute;width:0;height:0;z-index:3;opacity:clamp(0,calc((var(--f) - .15) * 2.5),1)}
.d5 .ground{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));transform:rotate(var(--n)) scaleY(var(--f))}
.d5 .stem{position:absolute;left:0;top:0;transform:rotate(var(--t)) scale(calc(.55 + .5 * var(--f)));transform-origin:0 0}
.d5 .needle{position:absolute;left:-1px;top:-17px;width:2px;height:17px;background:linear-gradient(90deg,#fff8e7,#b9b3a4);box-shadow:0 0 0 1px #000;border-radius:1px 1px 0 0}
.d5 .head{position:absolute;left:-11px;top:-38px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2.5px solid #fff8e7;background:#16173a center/cover no-repeat;box-shadow:0 0 0 1.75px #000,2.5px 2.5px 0 1.75px #000}
.d5 .head::after{content:'';position:absolute;left:3px;top:2px;width:7px;height:4px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.d5 .ok{position:absolute;left:5px;top:-44px;width:13px;height:13px;box-sizing:border-box;border-radius:50%;background:#6225e6;border:1.5px solid #000;display:grid;place-items:center}
.d5 .ok svg{width:8px;height:8px}
.d5 .chip{position:absolute;z-index:3;white-space:nowrap;background:#fff8e7;color:#16173a;border:2px solid #000;border-radius:6px;box-shadow:2px 2px 0 #000;padding:2px 6px 3px;font-size:10px;line-height:1.1;transform:rotate(-3deg)}
/* drapeau planté */
.d5 .spot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;border:2px solid #fff8e7;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.55);transform:rotate(var(--n)) scaleY(var(--f))}
.d5 .pole{position:absolute;left:-1.5px;top:-46px;width:3px;height:46px;background:#fff8e7;box-shadow:0 0 0 1.25px #000;border-radius:2px 2px 0 0}
.d5 .knob{position:absolute;left:-4.5px;top:-52px;width:9px;height:9px;box-sizing:border-box;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#f7dc6f 55%,#c9a83a);border:1.5px solid #000}
.d5 .flag{position:absolute;left:0;top:-47px;width:44px;height:32px;overflow:visible}
.d5 .fp{d:path('M1 1C11 -2 22 4 33 1V23C22 26 11 20 1 23Z')}
.d5 .shade{fill:url(#d5-sh)}
.d5 .tag{position:absolute;z-index:4;white-space:nowrap;background:#fff8e7;color:#16173a;border:2.5px solid #000;border-radius:8px;box-shadow:3px 3px 0 #000;padding:4px 9px 5px;font-size:13px;line-height:1.1;transform:rotate(-3deg)}
.d5 .tag i{font-style:normal;color:#6225e6}
.d5 .tag .sep{color:#6225e6;margin:0 3px}
.d5 .tag img{width:20px;height:14px;vertical-align:-2px;margin-right:6px;border:1.5px solid #000;border-radius:2px}
.d5 .tag .q{animation:d5-bob 1.4s ease-in-out infinite;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#6225e6;color:#fff8e7;border:1.5px solid #000;font-size:11px;vertical-align:-1px}
.d5 .tag::after{content:'';position:absolute;width:9px;height:9px;background:#fff8e7;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.d5 .tag.paris::after{left:-7px;top:8px;transform:rotate(135deg)}
.d5 .tag.athenes{font-size:12px;padding:3px 8px 4px;border-radius:7px}
.d5 .tag.athenes::after{left:38px;top:-7px;transform:rotate(225deg)}
.d5 .tag.athenes img{width:18px;height:12px}
.d5 .tag.athenes .q{width:16px;height:16px;font-size:10px}
/* trajet */
.d5 .trail{position:absolute;inset:0;z-index:2;pointer-events:none}
.d5 .trail path{fill:none;stroke-linecap:round;stroke-dasharray:0 7}
.d5 .trail .h{stroke:rgba(0,0,0,.55);stroke-width:4.6}
.d5 .trail .c{stroke:#fff8e7;stroke-width:2.6}
.d5 .trail .done{opacity:.8}
.d5 .trail .go path{animation:d5-march 1.1s linear infinite}
/* avion */
.d5 .plane,.d5 .pshadow{position:absolute;left:0;top:0;width:40px;height:26px;z-index:4;offset-rotate:auto;offset-anchor:50% 50%;offset-distance:44%;animation:d5-fly 6.5s ease-in-out -1s infinite}
.d5 .plane{offset-path:path('M149.2 568.4Q259.8 543.1 296.4 650.5')}
.d5 .pshadow{offset-path:path('M154.2 586.4Q264.8 561.1 299.4 668.5');z-index:2;filter:blur(.8px)}
.d5 .pshadow svg{display:block;opacity:.55;transform:scale(.8)}
.d5 .plane svg{display:block}
/* balise (cible) */
.d5 .ring{position:absolute;left:-12px;top:-12px;width:24px;height:24px;box-sizing:border-box;border-radius:50%;border:2.5px solid #ffee03;box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.6);transform:rotate(var(--n)) scaleY(var(--f))}
.d5 .ring.p{animation:d5-ping 1.8s ease-out infinite}
.d5 .core{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #000,0 0 8px 2px rgba(255,238,3,.9)}
/* étincelles */
.d5 .spark{position:absolute;z-index:4;width:14px;height:14px;margin:-7px 0 0 -7px;animation:d5-twinkle 2.4s ease-in-out infinite}
@keyframes d5-wave{0%,100%{d:path('M1 1C11 -2 22 4 33 1V23C22 26 11 20 1 23Z')}50%{d:path('M1 1C11 4 22 -2 33 1V23C22 20 11 26 1 23Z')}}
@keyframes d5-shade{from{transform:translateX(-22px)}to{transform:translateX(0)}}
@keyframes d5-bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.12)}}
@keyframes d5-march{to{stroke-dashoffset:-14}}
@keyframes d5-fly{0%{offset-distance:0%;opacity:0}10%{opacity:1}82%{opacity:1}92%,100%{offset-distance:100%;opacity:0}}
@keyframes d5-ping{0%{transform:rotate(var(--n)) scaleY(var(--f)) scale(.6);opacity:1}100%{transform:rotate(var(--n)) scaleY(var(--f)) scale(2);opacity:0}}
@keyframes d5-twinkle{0%,100%{transform:scale(.5) rotate(0);opacity:.3}50%{transform:scale(1) rotate(20deg);opacity:1}}
.d5 .fp{animation:d5-wave 1.6s ease-in-out infinite}
.d5 .shade{animation:d5-shade 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){
 .d5 .fp,.d5 .shade,.d5 .tag .q,.d5 .trail .go path,.d5 .ring.p,.d5 .spark{animation:none}
 .d5 .plane,.d5 .pshadow{animation:none;offset-distance:44%}
 .d5 .ring.p{display:none}
}
</style>

<script type="module">
import { mount } from '/files/avion-cartoon.js';
const q = new URLSearchParams(location.search), reglages = {}; // essais : ?bandeau=0
if (q.has('bandeau')) reglages.bandeau = q.get('bandeau') !== '0';
if (q.has('incl')) reglages.inclinaisonMax = +q.get('incl');
if (q.has('quille') || q.has('di') || q.has('wl')) reglages.forme = { quille: +(q.get('quille') ?? 0.27), diedres: (q.get('di') ?? '8,16').split(',').map(Number), winglet: q.get('wl') === '1' };
const vol = mount(document.getElementById('avion'), { reglages });
window.__avion = { stats: () => vol.stats(), cadre: () => vol.cadre(), ombre: () => vol.ombre(), mesurer: (n, t) => vol.mesurer(n, t), dispose: () => vol.dispose() };
if (new URLSearchParams(location.search).has('ombre')) { // superpose les sommets de l'ombre attendue (contrôle)
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 390 844'); svg.style.cssText = 'position:absolute;left:0;top:0;width:390px;height:844px;z-index:9;pointer-events:none';
  svg.innerHTML = vol.ombre().map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="0.8" fill="#0f0"/>').join('');
  document.querySelector('.d5.phone').appendChild(svg);
}
</script></body></html>
