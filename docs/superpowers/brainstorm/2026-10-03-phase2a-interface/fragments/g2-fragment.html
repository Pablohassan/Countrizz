  /* ---------- Drapeaux plantés ---------- */
  .d2 .pins { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  /* --x --y : pied du mât (coeurXY). --s : échelle = (0,5 + 0,5 × facing) × taille du pays.
     --t : inclinaison du mât le long de la normale (angle radial × 0,45 × √(1−facing²)). --o : estompe au bord. --tz : corrige le fanion pour rester lisible. */
  .d2 .pin { position: absolute; left: calc(var(--x) * 1px); top: calc(var(--y) * 1px); width: 0; height: 0; opacity: var(--o, 1); }
  .d2 .g { position: absolute; left: 0; top: 0; transform: scale(var(--s)); transform-origin: 0 0; }
  /* au sol : socle (petit disque crème couché dans le plan du sol), ombre du mât vers le bas-droite (soleil en haut à gauche) */
  .d2 .base { position: absolute; left: -10px; top: -4px; width: 20px; height: 8px; border-radius: 50%; box-sizing: border-box; transform: rotate(calc(var(--t) * 1deg));

              box-shadow: 0 0 0 .8px rgba(0,0,0,.6); animation: d2-ground .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--d) + .3s); }
  .d2 .cast { position: absolute; left: 0; top: -1px; width: 17px; height: 2.4px; border-radius: 2px; transform-origin: 0 50%; transform: rotate(22deg); background: linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,0)); animation: d2-fade .5s ease-out both; animation-delay: calc(var(--d) + .35s); }
  .d2 .drop { position: absolute; left: 0; top: 0; animation: d2-plant .65s cubic-bezier(.35,1.45,.55,1) both; animation-delay: var(--d); }
  .d2 .pole { position: absolute; left: -1.5px; top: -40px; width: 3px; height: 40.5px; transform-origin: 50% 100%; transform: rotate(calc(var(--t) * 1deg)); }
  .d2 .mast { position: absolute; inset: 0; border-radius: 1.5px 1.5px 0 0;
              background: linear-gradient(90deg, #000 0 .7px, #fffaf0 .7px 1.7px, #c8bc9f 1.7px 2.3px, #000 2.3px); }
  .d2 .mast::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(to top, rgba(30,20,8,.95), rgba(30,20,8,0)); }
  .d2 .knob { position: absolute; left: 50%; top: -5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; box-sizing: border-box; border: 1px solid #000;
              background: radial-gradient(circle at 35% 30%, #fffbe0 0 18%, #f7dc6f 45%, #c49a1c); }
  /* le drapeau réel (SVG), découpé en 6 lés qui ondulent en décalé ; liseré noir + ombre nette comme les autocollants */
  .d2 .flag { position: absolute; left: 2.2px; top: 1px; width: 26px; height: var(--fh, 17.3px); transform-origin: 0 50%;
              filter: drop-shadow(.75px 0 0 #000) drop-shadow(-.75px 0 0 #000) drop-shadow(0 .75px 0 #000) drop-shadow(0 -.75px 0 #000) drop-shadow(1.6px 1.8px 0 rgba(0,0,0,.45)); }
  .d2 .flag i { position: absolute; top: 0; height: 100%; width: calc(100% / 6 + .35px); background-image: var(--f); background-size: 600% 100%; background-repeat: no-repeat;
                animation: d2-wave 1.5s ease-in-out infinite; }
  .d2 .flag i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.28), rgba(0,0,0,.22)); opacity: 0; animation: d2-fold 1.5s ease-in-out infinite; animation-delay: inherit; }
  .d2 .flag i:nth-child(1) { left: 0;              background-position: 0 0;    --k: 0;   animation-delay: 0s; }
  .d2 .flag i:nth-child(2) { left: calc(100%/6);   background-position: 20% 0;  --k: .35; animation-delay: -.2s; }
  .d2 .flag i:nth-child(3) { left: calc(200%/6);   background-position: 40% 0;  --k: .6;  animation-delay: -.4s; }
  .d2 .flag i:nth-child(4) { left: calc(300%/6);   background-position: 60% 0;  --k: .8;  animation-delay: -.6s; }

  .d2 .flag i:nth-child(6) { left: calc(500%/6);   background-position: 100% 0; --k: 1.1; animation-delay: -1s; }
  /* fanion crème (queue d'aronde) au nom du pays, sous le drapeau */
  .d2 .tagw { position: absolute; left: 2.2px; top: calc(var(--fh, 17.3px) + 3.5px); transform-origin: 0 50%; animation: d2-sway 3.2s ease-in-out infinite; animation-delay: var(--d);

  .d2 .tag { display: block; font: calc(8.5px * var(--tz, 1))/1.5 'Chango', system-ui; height: 1.45em; padding: 0 1.1em 0 .45em; background: #fff8e7; color: #16173a; white-space: nowrap;

  .d2 .cap .halo { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid rgba(247,220,111,.9); opacity: 0; animation: d2-ring 3.4s ease-out infinite; animation-delay: var(--d); }
  .d2 .cap b { position: absolute; top: -6px; left: 7.5px; font: italic 600 9px/12px system-ui, sans-serif; color: #fff8e7; white-space: nowrap; letter-spacing: .25px;

  .d2 .cap.l b { left: auto; right: 7.5px; }
  .d2 .cap.u b { left: 0; top: 5px; transform: translateX(-50%); }

  @keyframes d2-wave { 0%, 100% { transform: translateY(calc(var(--k) * -1px)); } 50% { transform: translateY(calc(var(--k) * 1px)); } }
  @keyframes d2-fold { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes d2-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes d2-plant { 0% { transform: translateY(-30px); opacity: 0; } 40% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  @keyframes d2-ground { 0% { transform: rotate(calc(var(--t) * 1deg)) scale(.2); opacity: 0; } 100% { transform: rotate(calc(var(--t) * 1deg)) scale(1); opacity: 1; } }
  @keyframes d2-fade { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes d2-pop { 0% { transform: scale(0); } 100% { transform: scale(var(--s)); } }
  @keyframes d2-twinkle { 0%, 72%, 100% { transform: rotate(0) scale(1); } 82% { transform: rotate(36deg) scale(1.25); } }
  @keyframes d2-ring { 0%, 60% { transform: scale(.6); opacity: 0; } 68% { opacity: .9; } 100% { transform: scale(2); opacity: 0; } }
