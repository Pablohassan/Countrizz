/* ——— Gabarit H3 · Lever de Terre ——— */
.d3.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;font-family:'Chango',system-ui;background:#000;box-shadow:0 0 0 10px #0b0b10,0 12px 36px rgba(0,0,0,.45)}
.d3 .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 30px 60px,#fff,transparent),radial-gradient(1px 1px at 120px 140px,#ddd,transparent),radial-gradient(1.5px 1.5px at 300px 90px,#fff,transparent),radial-gradient(1px 1px at 250px 220px,#ccc,transparent),radial-gradient(1px 1px at 60px 300px,#fff,transparent),radial-gradient(1px 1px at 350px 330px,#bbb,transparent),radial-gradient(1.5px 1.5px at 180px 380px,#fff,transparent),radial-gradient(1px 1px at 20px 400px,#ccc,transparent),radial-gradient(1px 1px at 330px 20px,#fff,transparent)}
.d3 .globe{position:absolute;inset:0;background:url('ASSET/acc-16.png') center 400px/390px 844px no-repeat}
.d3 .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:18px;background:#000;z-index:9}
.d3 .lang{position:absolute;top:56px;right:18px;z-index:6;display:flex;border:2px solid #000;box-shadow:3px 3px 0 #000;border-radius:10px;overflow:hidden;font-size:14px}
.d3 .lang span{padding:5px 10px;background:#16173a;color:#f7dc6f}
.d3 .lang span.on{background:#f7dc6f;color:#16173a}
.d3 .title{position:absolute;left:0;right:0;top:110px;text-align:center;z-index:5;color:#f7dc6f;font-size:54px;text-shadow:-6px 4px 2px rgb(11,13,15);letter-spacing:1px}
.d3 .controls{position:absolute;left:28px;right:28px;top:215px;z-index:5;display:flex;flex-direction:column;align-items:stretch;gap:18px}
.d3 .name{background:#16173a;border:3px solid #f7dc6f;box-shadow:4px 4px 0 #000;color:rgba(247,220,111,.55);padding:12px 14px;font-size:16px;border-radius:4px}
.d3 .name b{color:#f7dc6f;font-weight:normal}
.d3 .play{align-self:center;display:flex;align-items:center;gap:18px;background:#6225e6;color:#fff;border:2px solid #000;box-shadow:6px 6px 0 #000;transform:skewX(-15deg);padding:12px 30px;font-size:30px}
.d3 .play>span{transform:skewX(15deg);display:inline-block}
.d3 .play svg{width:40px;height:26px;transform:skewX(15deg)}
.d3 .row2{display:flex;justify-content:center;gap:18px}
.d3 .sec{background:#16173a;color:#f7dc6f;border:2px solid #000;box-shadow:4px 4px 0 #000;transform:skewX(-15deg);padding:9px 18px;font-size:15px}
.d3 .sec>span{transform:skewX(15deg);display:inline-block}
.d3 .credit{position:absolute;left:12px;right:10px;bottom:38px;z-index:6;font:10px/1.3 system-ui,sans-serif;color:rgba(255,255,255,.7);text-shadow:0 0 2px #000;text-align:right}
.d3 .credit u{text-decoration:underline}

/* ——— Étiquettes de voyage ——— */
.d3 .pins{position:absolute;inset:0;z-index:4;pointer-events:none}
.d3 .rp{position:absolute;width:0;height:0}
.d3 .pop{position:absolute;left:0;top:0;transform-origin:0 0;animation:d3-pop .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.15s + var(--i) * .13s)}
.d3 .sc{position:absolute;left:0;top:0;transform:scale(var(--s));transform-origin:0 0;opacity:var(--o)}
.d3 .sway{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;animation:d3-sway calc(4.2s + var(--i) * .6s) ease-in-out infinite alternate;animation-delay:calc(var(--i) * -1.7s)}

/* ficelle pointillée : perles crème cerclées de noir */
.d3 .str{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.d3 .str path{fill:none;stroke-linecap:round;stroke-dasharray:0 5.6}
.d3 .str path:first-child{stroke:#000;stroke-width:3.8}
.d3 .str path:last-child{stroke:#fff8e7;stroke-width:2}

/* point de capitale ◉ */
.d3 .cap{position:absolute;left:-6.5px;top:-6.5px;width:13px;height:13px;box-sizing:border-box;border-radius:50%;border:2px solid #000;background:radial-gradient(circle,#6225e6 0 2.7px,#fff8e7 3.1px);box-shadow:1.5px 1.5px 0 rgba(0,0,0,.6)}

.d3 .lab{position:absolute;transform:rotate(var(--r));

/* timbre-poste dentelé */
.d3 .stamp{width:72px;height:84px}
.d3 .perf{position:absolute;inset:0;background:#fff8e7;
  -webkit-mask:radial-gradient(circle at 3px 3px,#0000 1.9px,#000 2.3px) -3px -3px/6px 6px repeat,linear-gradient(#000 0 0) 3px 3px/66px 78px no-repeat;
  mask:radial-gradient(circle at 3px 3px,#0000 1.9px,#000 2.3px) -3px -3px/6px 6px repeat,linear-gradient(#000 0 0) 3px 3px/66px 78px no-repeat}
.d3 .frame{position:absolute;inset:6px;border:1px solid rgba(22,23,58,.3);padding:3px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}
.d3 .stamp img{display:block;width:100%;height:30px;object-fit:cover;border:1.5px solid #000;border-radius:1.5px;box-sizing:border-box}
.d3 .stamp b{font:10px/1 'Chango',system-ui;color:#16173a;margin-top:6px;white-space:nowrap}
.d3 .stamp i{font:800 7.2px/1 system-ui,sans-serif;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#6225e6;margin-top:4px;white-space:nowrap}
.d3 .pm{position:absolute;right:-4px;top:-3px;width:40px;height:30px;fill:none;stroke:rgba(22,23,58,.42);stroke-width:1}

/* étiquette de bagage (largeur auto, œillet à 11,18) */
.d3 .tag{height:36px;white-space:nowrap}
.d3 .tag .body{position:relative;height:36px;box-sizing:border-box;display:flex;align-items:center;gap:5px;padding:0 15px 0 23px;

.d3 .tag.flip .body{padding:0 23px 0 15px;background:linear-gradient(90deg,#6225e6 0 8px,#fff8e7 0);

.d3 .tag i{display:block;font:800 7px/1 system-ui,sans-serif;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#6225e6;margin-top:3px}

.d3 .home .cap::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid #f7dc6f;animation:d3-ping 2.4s ease-out infinite}

/* trajet Paris → Le Caire */
.d3 .route{position:absolute;left:0;top:0;width:390px;height:844px;z-index:3;pointer-events:none}

.d3 .plane{position:absolute;left:0;top:0;z-index:4;width:17px;height:17px;offset-path:path('M149.2 568.4Q280 575 364.9 716.7');offset-rotate:auto;offset-distance:62%;animation:d3-fly 10s linear infinite;animation-delay:-5.5s}
.d3 .plane svg{display:block;width:100%;height:100%;overflow:visible}
.d3 .plane path{fill:#fff8e7;stroke:#000;stroke-width:2.2;stroke-linejoin:round;paint-order:stroke}

@keyframes d3-pop{from{transform:scale(0);opacity:0}50%{opacity:1}to{transform:scale(1);opacity:1}}
@keyframes d3-sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes d3-wave{from{transform:skewY(-6deg) scaleX(.93)}to{transform:skewY(4deg) scaleX(1)}}
@keyframes d3-ripple{to{background-position:-34px 0}}
@keyframes d3-ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
@keyframes d3-march{to{stroke-dashoffset:-11}}
@keyframes d3-fly{0%{offset-distance:6%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:93%;opacity:0}}

@media (prefers-reduced-motion:reduce){
  .d3 .pop,.d3 .sway,.d3 .home .cloth,.d3 .home .cloth::after,.d3 .home .cap::before,.d3 .route path,.d3 .plane{animation:none}
  .d3 .home .cap::before{display:none}
}
